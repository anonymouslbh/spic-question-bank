<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440"><rect width="1040" height="440" fill="white"/><g font-family="Microsoft YaHei,SimHei,sans-serif" fill="#183540"><text x="28" y="42" font-size="18">多选题 · 已对照原卷还原选项</text><text x="28" y="95" font-size="25">国家电投“均衡增长战略”，具体包括（）。</text><rect x="24" y="125" width="992" height="62" rx="10" fill="#f7f9fa" stroke="#d5dfe3"/><text x="44" y="165" font-size="23">A. 规模增长和投资能力均衡匹配</text><rect x="24" y="199" width="992" height="62" rx="10" fill="#f7f9fa" stroke="#d5dfe3"/><text x="44" y="239" font-size="23">B. 电源品种和区域布局均衡优化</text><rect x="24" y="273" width="992" height="62" rx="10" fill="#f7f9fa" stroke="#d5dfe3"/><text x="44" y="313" font-size="23">C. 传统产业和创新业态均衡发展</text><rect x="24" y="347" width="992" height="62" rx="10" fill="#f7f9fa" stroke="#d5dfe3"/><text x="44" y="387" font-size="23">D. 存量提质和增量做优均衡推进</text></g></svg>